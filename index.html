<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Life</title>

  <!-- ===== PWA Meta Tags ===== -->
  <meta name="theme-color" content="#4f8edb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Life">
  <meta name="application-name" content="My Life">
  
  <!-- ===== PWA Icons ===== -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <!-- ===== PWA Service Worker ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(function(registration) {
            console.log('✅ ServiceWorker registered successfully with scope: ', registration.scope);
          })
          .catch(function(err) {
            console.log('❌ ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>

  <!-- Main website styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/events.css">
  <link rel="stylesheet" href="css/program.css">

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header id="main-header">

    <div class="header-left">
      <!-- زر القائمة (يظهر فقط على Desktop) -->
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
        <span class="menu-icon"></span>
        <span class="menu-icon"></span>
        <span class="menu-icon"></span>
      </button>
    </div>

    <div class="header-title">
      <span class="title-border">My Life</span>
    </div>

    <button
      id="user-profile-btn"
      type="button"
      aria-label="Open profile"
    >
      <img
        id="user-avatar-icon"
        src=""
        alt="User avatar"
      >

      <span id="user-name-icon">User 1</span>
    </button>

  </header>


  <!-- ================= MAIN LAYOUT ================= -->
  <div id="layout">

    <!-- ================= SIDEBAR ================= -->
    <nav id="sidebar" aria-label="Main navigation">

      <button
        class="nav-btn active"
        data-target="routine"
        type="button"
      >
        Routine
      </button>

      <button
        class="nav-btn"
        data-target="task"
        type="button"
      >
        Tasks
      </button>

      <button
        class="nav-btn"
        data-target="completed"
        type="button"
      >
        Completed
      </button>

      <button
        class="nav-btn"
        data-target="notes"
        type="button"
      >
        Notes
      </button>

      <button
        class="nav-btn"
        data-target="events"
        type="button"
      >
        Events
      </button>

      <button
        class="nav-btn"
        data-target="program"
        type="button"
      >
        Program
      </button>

    </nav>


    <!-- ================= APPLICATION ================= -->
    <main id="app" aria-live="polite"></main>

  </div>


  <!-- ================= BOTTOM NAVIGATION (Mobile فقط) ================= -->
  <nav id="bottom-nav" aria-label="Mobile navigation">

    <button class="bottom-nav-btn active" data-target="routine" type="button">
      <span class="bn-icon" data-lucide="clock"></span>
      <span class="bn-label">Routine</span>
    </button>

    <button class="bottom-nav-btn" data-target="task" type="button">
      <span class="bn-icon" data-lucide="check-circle"></span>
      <span class="bn-label">Tasks</span>
    </button>

    <button class="bottom-nav-btn" data-target="events" type="button">
      <span class="bn-icon" data-lucide="calendar"></span>
      <span class="bn-label">Events</span>
    </button>

    <button class="bottom-nav-btn" data-target="program" type="button">
      <span class="bn-icon" data-lucide="graduation-cap"></span>
      <span class="bn-label">Programs</span>
    </button>

  </nav>


  <!-- ================= NOTES FLOATING BUTTON (Mobile فقط - الزاوية اليمنى) ================= -->
  <div id="notes-fab" aria-label="Open notes">
    <button class="fab-btn" id="notes-fab-btn" type="button" aria-label="Notes">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
    </button>
  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <!-- ===== الملفات الأساسية (تُحمّل أولاً) ===== -->
  <script src="js/storage.js"></script>
  <script src="js/week.js"></script>
  <script src="js/day.js"></script>
  <script src="js/task.js"></script>
  <script src="js/achievements.js"></script>  <!-- ✅ تم التصحيح: حروف صغيرة -->
  <script src="js/note.js"></script>
  <script src="js/events.js"></script>
  <script src="js/program.js"></script>
  <script src="js/profile.js"></script>

  <!-- ===== الملفات الثانوية (تحميل كسول) ===== -->
  <script src="js/notification.js" defer></script>
  <script src="js/backup.js" defer></script>
  <script src="js/update.js" defer></script>
  <script src="js/hour.js" defer></script>

  <!-- ===== الترجمات (تحميل كسول) ===== -->
  <script src="lang/en.js" defer></script>
  <script src="lang/ar.js" defer></script>
  <script src="lang/fr.js" defer></script>
  <script src="js/translations.js" defer></script>

  <!-- ===== الملف الرئيسي (تحميل كسول) ===== -->
  <script src="js/main.js" defer></script>

</body>
</html>
